name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go é o backend executável desde a 002-13. A versão vem da linha `go` do
      # go.mod; o cache usa tools/go.sum porque o módulo principal não tem deps.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum

      # O baseline .NET continua compilando e testando até o cutover da 002-15.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Verify toolchain versions
        run: go version && node --version && npm --version

      - name: Verify Go modules
        run: go mod verify && go mod verify -modfile=tools/go.mod

      - name: Vet Go
        run: go vet ./...

      - name: Test Go with race detector
        run: go test -race ./...

      - name: Lint Go
        run: go tool -modfile=tools/go.mod golangci-lint run

      - name: Build Go API
        run: go build ./cmd/crownpilot-api

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Restore .NET
        run: dotnet restore CrownPilot.sln

      - name: Build .NET
        run: dotnet build CrownPilot.sln --configuration Release --no-restore

      - name: Test .NET
        run: dotnet test CrownPilot.sln --configuration Release --no-build

      - name: Check layer boundaries
        run: node scripts/check-boundaries.mjs

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # Regenera os artefatos a partir de api/openapi/v1.json e falha se o
      # resultado divergir do que está versionado.
      - name: Check generated OpenAPI artifacts for drift
        run: |
          go generate ./...
          npm run openapi:generate --prefix frontend
          git diff --exit-code -- internal/httpapi/api.gen.go frontend/src/api/schema.gen.ts

      - name: Type-check frontend
        run: npm run typecheck --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Test frontend
        run: npm run test:unit --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Check OpenAPI contract
        run: npm run openapi:check --prefix frontend

      - name: Smoke local API
        run: npm run smoke --prefix frontend

      - name: Smoke OCI image
        run: npm run smoke:container --prefix frontend
