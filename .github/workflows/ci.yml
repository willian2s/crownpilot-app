name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Verify Node and npm
        run: node --version && npm --version

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Restore .NET
        run: dotnet restore CrownPilot.sln

      - name: Build .NET
        run: dotnet build CrownPilot.sln --configuration Release --no-restore

      - name: Test .NET
        run: dotnet test CrownPilot.sln --configuration Release --no-build

      - name: Check layer boundaries
        run: node scripts/check-boundaries.mjs

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Type-check frontend
        run: npm run typecheck --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Test frontend
        run: npm run test:unit --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Smoke OCI image
        run: npm run smoke:container --prefix frontend
